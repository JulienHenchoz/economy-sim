<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Économie de l'île</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button class="toggle-sidebar small" id="toggleSidebar">Politique ☰</button>
        <h1>🏝️ Économie de l'île</h1>
        <span class="date" id="date">Jour 0</span>
      </div>
      <div class="controls">
        <button class="primary" id="play">▶ Lancer</button>
        <button id="stepDay" title="Avancer d'un jour">+1 j</button>
        <button id="stepMonth" title="Avancer d'un mois">+1 mois</button>
        <button id="stepYear" title="Avancer d'un an">+1 an</button>
        <label for="speed">Vitesse</label>
        <select id="speed">
          <option value="2">2 j/s</option>
          <option value="10">10 j/s</option>
          <option value="30" selected>30 j/s</option>
          <option value="90">90 j/s</option>
          <option value="1000">max</option>
        </select>
        <span class="perf" id="perf"></span>
        <button id="export" title="Télécharger l'historique en CSV">CSV</button>
        <button id="reset">Nouvelle île…</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main>
        <div class="banner" id="banner"></div>
        <section class="timeline" id="timeline">
          <div class="tl-row">
            <label class="tl-field">Branche
              <select id="branchSel"></select>
            </label>
            <button class="small" id="branchRename" title="Renommer la branche">✎</button>
            <button class="small" id="branchDelete" title="Supprimer une autre branche">🗑</button>
            <label class="tl-field">Comparer avec
              <select id="compareSel"><option value="">—</option></select>
            </label>
            <span class="tl-day" id="tlDay"></span>
          </div>
          <div class="tl-track">
            <div class="tl-marks" id="tlMarks"></div>
            <input type="range" id="tlRange" min="0" max="0" step="1" value="0" aria-label="Ligne du temps" />
          </div>
          <div class="tl-view" id="tlView">
            <span id="tlViewText"></span>
            <button class="primary small" id="tlFork">Reprendre d’ici (nouvelle branche)</button>
            <button class="small" id="tlPresent">Revenir au présent</button>
          </div>
        </section>
        <section class="kpis" id="kpis"></section>
        <nav class="tabs" id="tabs"></nav>
        <div id="views"></div>
      </main>
    </div>

    <dialog id="zoneDialog"><div id="zoneBody"></div><div class="dialog-actions"><button id="zoneClose">Fermer</button></div></dialog>
    <dialog id="agentDialog"><div id="agentBody"></div><div class="dialog-actions"><button id="agentClose">Fermer</button></div></dialog>

    <dialog id="resetDialog">
      <h3>Nouvelle île</h3>
      <p class="desc">La simulation repart du jour 0. La politique publique actuelle est conservée.</p>
      <div class="form-grid">
        <label>Graine aléatoire<input type="number" id="rSeed" min="1" step="1" /></label>
        <label>Habitants<input type="number" id="rPop" min="100" max="3000" step="50" /></label>
        <label>Écus par habitant au départ<input type="number" id="rMoney" min="10" max="5000" step="10" /></label>
        <label>Part de la monnaie détenue par l'État (%)<input type="number" id="rState" min="0" max="80" step="1" /></label>
      </div>
      <div class="dialog-actions">
        <button id="rCancel">Annuler</button>
        <button class="primary" id="rGo">Créer</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
